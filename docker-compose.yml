services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salary_db
      POSTGRES_USER: salary_user
      POSTGRES_PASSWORD: salary_pass
    ports:
      - "5432:5432"
    volumes:
      - salary_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary_user -d salary_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker,seed
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  salary_db_data:
